<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Aspen Grove Conference Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: follows the Aspen Grove website. Navy header band, white nav strip, light grey page with white cards, royal-blue actions, IBM Plex Sans throughout. Section rail on the left, form on the right. */
:root{
  --bg:#f6f6f8; --surface:#ffffff; --sunk:#eef2f7; --line:#e1e5eb; --rule:#afd6fe;
  --fg:#141414; --muted:#666666;
  --navy:#002e5d; --navy-deep:#001832; --navy-ink:#ffffff; --title:#002e5d;
  --spruce:#0047ba; --spruce-ink:#ffffff; --aspen:#0047ba; --aspen-soft:#e7f1fe;
  --ok:#1f7a45; --ok-soft:#dff1e6; --warn:#9a5a00; --warn-soft:#fdf0d9; --bad:#c41230; --bad-soft:#fde4e7;
  --display:"IBM Plex Sans","Open Sans",Helvetica,Arial,sans-serif;
  --body:"IBM Plex Sans","Open Sans",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:4px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1722; --surface:#142132; --sunk:#1a2b40; --line:#2a3d55; --rule:#2f527d;
  --fg:#e9eef4; --muted:#9db0c4;
  --navy:#001832; --navy-deep:#000f20; --navy-ink:#ffffff; --title:#e9eef4;
  --spruce:#7db4ff; --spruce-ink:#06203f; --aspen:#7db4ff; --aspen-soft:#1a2f4d;
  --ok:#7fcf9c; --ok-soft:#1b3325; --warn:#f0b65c; --warn-soft:#3a2c14; --bad:#ff8a95; --bad-soft:#3d1d22;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1722; --surface:#142132; --sunk:#1a2b40; --line:#2a3d55; --rule:#2f527d;
  --fg:#e9eef4; --muted:#9db0c4;
  --navy:#001832; --navy-deep:#000f20; --navy-ink:#ffffff; --title:#e9eef4;
  --spruce:#7db4ff; --spruce-ink:#06203f; --aspen:#7db4ff; --aspen-soft:#1a2f4d;
  --ok:#7fcf9c; --ok-soft:#1b3325; --warn:#f0b65c; --warn-soft:#3a2c14; --bad:#ff8a95; --bad-soft:#3d1d22;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.75rem}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--aspen);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* masthead: navy band like the Aspen Grove site header, then a white strip with the page title and view switch */
.band{margin-inline:-16px;background:var(--navy);color:var(--navy-ink)}
.band-in{max-width:1120px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lockup{display:flex;align-items:center;gap:14px;font-size:1.35rem;font-weight:500;letter-spacing:.01em}
.lockup .div{width:1px;align-self:stretch;background:rgba(255,255,255,.35)}
.lockup .sub{font-size:.95rem;font-weight:400;opacity:.85}
.proto{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(255,255,255,.5);padding:2px 8px;border-radius:3px;color:var(--navy-ink)}
.strip{margin-inline:-16px;background:var(--surface);border-bottom:1px solid var(--line);margin-bottom:20px}
.strip-in{max-width:1120px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.strip h1{font-size:1.6rem;color:var(--title)}
.tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.tabs button{border:0;background:var(--surface);padding:7px 16px;cursor:pointer;font-weight:500;color:var(--muted);font-size:.9rem}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button[aria-pressed="true"]{background:var(--spruce);color:var(--spruce-ink)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:3px;cursor:pointer;font-weight:600;color:var(--spruce)}
.btn:hover{border-color:var(--spruce)}
.btn.primary{background:var(--spruce);color:var(--spruce-ink);border-color:var(--spruce)}
.btn.primary:hover{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.gold{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--spruce);padding-inline:8px}
.btn.danger{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.danger-text{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.notice{padding:10px 14px;border-radius:var(--r);font-size:.925rem}
.notice.info{background:var(--sunk)}
.notice.warn{background:var(--warn-soft);color:var(--fg);border-left:4px solid var(--warn)}
.notice.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.notice.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}

/* home */
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:14px}
.panel p{margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.steps b{color:var(--fg)}

/* form layout */
.editor{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.editor{grid-template-columns:minmax(0,1fr)}.rail{position:static!important}}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:14px}
.rail nav{display:flex;flex-direction:column;gap:2px}
@media (max-width:820px){.rail nav{flex-direction:row;flex-wrap:wrap}}
.rail a{display:flex;justify-content:space-between;gap:8px;text-decoration:none;color:var(--fg);padding:6px 10px;border-radius:6px;font-size:.925rem}
.rail a:hover{background:var(--sunk)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;align-self:center}
.dot.done{background:var(--ok)}
.codecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.codecard .code{font-size:1.4rem;letter-spacing:.06em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;width:fit-content}
.pill.draft{background:var(--warn-soft);color:var(--warn)}
.pill.locked{background:var(--ok-soft);color:var(--ok)}
.save{font-size:.8rem;color:var(--muted)}

.form{display:flex;flex-direction:column;gap:22px;min-width:0}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px;min-width:0}
.sechead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;border-bottom:2px solid var(--rule);padding-bottom:10px}
.sechead .num{font-family:var(--mono);color:var(--aspen);font-size:.85rem;margin-right:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;align-items:start}
.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem;min-width:0}
.f .hint{font-weight:400;color:var(--muted);font-size:.8rem}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-weight:400;min-width:0}
textarea{min-height:76px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{opacity:.75;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:6px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.9rem}
.seg label+label{border-left:1px solid var(--line)}
.seg input{accent-color:var(--spruce)}
.seg label:has(input:checked){background:var(--sunk)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:3px;cursor:pointer;font-size:.9rem}
.chk:has(input:checked){border-color:var(--spruce);background:var(--sunk)}
.chk input{accent-color:var(--spruce)}

/* days */
.daytabs{display:flex;gap:6px;flex-wrap:wrap}
.daytabs button{border:1px solid var(--line);background:var(--bg);padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:center}
.daytabs button[aria-pressed="true"]{background:var(--spruce);color:var(--spruce-ink);border-color:var(--spruce)}
.stickybar{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--surface);margin-inline:-22px;padding:10px 22px;border-bottom:1px solid var(--line)}
.dtab{position:relative;display:inline-flex}
.peek{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:20;width:min(340px,80vw);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.18);padding:12px 14px;flex-direction:column;gap:6px;font-size:.85rem;line-height:1.35;text-align:left;pointer-events:none}
.dtab.right .peek{left:auto;right:0}
.peek::before{content:"";position:absolute;top:-6px;left:22px;width:10px;height:10px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.dtab.right .peek::before{left:auto;right:22px}
@media (hover:hover){.dtab:hover .peek{display:flex}}
.dtab:has(button:focus-visible) .peek{display:flex}
.pk-h{font-family:var(--display);font-weight:600;font-size:.95rem;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:2px}
.pk-r{display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px}
.pk-l{color:var(--muted);font-size:.8rem;padding-top:1px}
.pk-v b{font-weight:600}
.pk-miss{color:var(--warn);font-weight:600}
@media (prefers-reduced-motion:no-preference){.peek{animation:pk .12s ease-out}@keyframes pk{from{opacity:0;transform:translateY(-3px)}}}
.daynav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.flag{display:inline-flex;width:fit-content;font-size:.78rem;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:2px 10px;border-radius:999px}
.meal{border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px}
.mealhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.mealhead .t{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.mealgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(110px,1fr);gap:10px}
@media (max-width:520px){.mealgrid{grid-template-columns:minmax(0,1fr)}}
.sides{font-size:.85rem;color:var(--muted);margin:0}
.snackcats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.snackcats h4{margin:0 0 6px;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.snackcats .checks{flex-direction:column;align-items:stretch;gap:4px}
.snackcats .chk{border-radius:6px}
.chk.full{opacity:.45}
.count{font-family:var(--mono);font-size:.85rem}

/* allergies */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.925rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td input{min-width:120px}

/* costs + lock */
.extras{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.extras .ln{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--line);padding-block:4px}
.lockbar{display:flex;flex-direction:column;gap:12px}
.missing{margin:0;padding-left:1.2em}
.needbox .missing{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.needlink{border:0;background:none;padding:0;color:var(--bad);font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:left}
.needlink:hover{color:var(--fg)}
.need{outline:2px solid var(--bad);outline-offset:2px;border-radius:6px}
input.need,select.need,textarea.need{outline:0;border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-soft),0 0 0 1px var(--bad) inset}
.daytabs button.need{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
.needrail{display:flex;flex-direction:column;gap:6px}
.needrail .btn{width:fit-content}
@media (prefers-reduced-motion:no-preference){.flash{animation:needflash 1.5s ease-out}@keyframes needflash{0%,40%{box-shadow:0 0 0 6px var(--bad-soft)}100%{box-shadow:0 0 0 0 transparent}}}
.confirm{display:flex;flex-direction:column;gap:10px;border:2px solid var(--spruce);border-radius:var(--r);padding:16px;background:var(--aspen-soft)}

/* review */
.nextstep{flex-direction:row!important;flex-wrap:wrap;justify-content:space-between;align-items:center;background:var(--sunk)!important}
.reviewhead{display:flex;flex-direction:column;gap:4px;padding-block:4px 2px}
.reviewhead .eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--aspen);font-weight:700}
.rtitle{font-size:1.6rem}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 24px;margin:0}
.kv>div{min-width:0}
.kv dt{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kv dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.prose{margin:0;white-space:pre-wrap;max-width:65ch}
.missingval{color:var(--warn);font-weight:600}
.sumday{display:flex;flex-direction:column;gap:6px}
.sumday+.sumday{border-top:1px solid var(--line);padding-top:14px}
.sumtable th{width:150px;text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--fg);font-weight:600}
.sumtable td.tm{width:90px;white-space:nowrap;color:var(--muted);font-size:.85rem}
.sumtable tr:last-child th,.sumtable tr:last-child td{border-bottom:0}
/* new: counts, allergies, attendee list */
.mealgrid3{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:start}
@media (max-width:620px){.mealgrid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.mealgrid3>:first-child{grid-column:1/-1}}
.mwarn{display:flex;flex-direction:column;gap:2px}.mwarn:empty{display:none}
.warnline{font-size:.82rem;font-weight:600;color:var(--warn)}
.albadge{display:flex;flex-direction:column;gap:2px;font-size:.85rem;background:var(--warn-soft);border-left:3px solid var(--warn);padding:7px 11px;border-radius:3px}
.albadge.sev{background:var(--bad-soft);border-left-color:var(--bad)}
.albadge span{color:var(--fg);opacity:.85}
.rhint{font-size:.83rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn.tiny{padding:2px 8px;font-size:.8rem}
.subhead{font-weight:600;padding-top:14px;border-top:1px solid var(--line)}
.rosterbox{display:flex;flex-direction:column;gap:10px;border:1px dashed var(--spruce);border-radius:var(--r);padding:14px 16px;background:var(--aspen-soft)}
.rosterbox details summary{cursor:pointer;color:var(--spruce);font-weight:600;font-size:.9rem}
.coltable th{text-transform:none;letter-spacing:0;font-size:.85rem;color:var(--fg);width:210px}
.coltable td{font-size:.85rem}
.tplbox{display:flex;flex-direction:column;gap:6px}
.tplbox textarea{font-family:var(--mono);font-size:.78rem;min-height:110px;white-space:pre;overflow:auto}
.altable td{vertical-align:top}
.altable select{min-width:130px}
.alother{margin-top:6px;display:block;width:100%}
.altable select[id^="al-mode"]{min-width:190px}
.altable td input{min-width:140px}
.altable td .hint{display:block;margin-top:3px;font-size:.78rem;color:var(--muted)}
.altable tr.hasgrid td{border-bottom:0}
.gridrow td{background:var(--sunk)}
.algrid{overflow-x:auto;margin-top:6px}
.algrid table{width:auto;font-size:.85rem}
.algrid th,.algrid td{text-align:center;padding:4px 8px}
.algrid thead th{text-transform:none;letter-spacing:0;font-size:.8rem}
.algrid th[scope=row]{text-align:left;white-space:nowrap;text-transform:none;letter-spacing:0;color:var(--fg);font-size:.85rem}
.algrid input{accent-color:var(--spruce);width:16px;height:16px}
.sevtag{font-weight:600}.sevtag.sev{color:var(--bad)}
.bymeal tr.sevrow td{background:var(--bad-soft)}
.sumtable td.gc{width:96px;white-space:nowrap;color:var(--muted);font-size:.85rem}
.pk-sev{color:var(--bad);font-weight:600}
/* staff: meal locations */
.bulk{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--sunk);padding:12px 14px;border-radius:var(--r)}
.bulk select{min-width:170px}
.plantable{table-layout:fixed;min-width:680px}
.plantable th:nth-child(1){width:150px}.plantable th:nth-child(2){width:150px}.plantable th:nth-child(3){width:80px}.plantable th:nth-child(5){width:250px}
.plantable select{width:100%}
.plantable th[scope=row]{text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--fg);white-space:nowrap}
.plantable tr.off th,.plantable tr.off td{color:var(--muted)}
.plantable td.mono{white-space:nowrap}
.locnote,.roomsel{margin-top:6px;display:block;width:100%}
.tchg{display:inline-block;margin-left:4px;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.chk.mealon{width:fit-content;min-height:44px}
.expick{display:flex;flex-direction:column;gap:6px}.expick .exh{font-weight:600;font-size:.9rem}.expick .chk{min-height:44px}
.exnote{margin:0;background:var(--sunk);border-radius:var(--r);padding:6px 10px}
.dtl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}.dts{font-size:.72rem;font-weight:400;opacity:.85}
.dts.none{color:var(--warn);font-weight:600;opacity:1}.daytabs button[aria-pressed="true"] .dts.none{color:inherit}
.mealcheck tr.emptyday th,.mealcheck tr.emptyday td{background:var(--warn-soft)}
.demobar{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;margin-bottom:16px;border-left:4px solid var(--spruce)}
.tchange h3{font-size:1rem}.tcgrid{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px}@media (max-width:520px){.tcgrid{grid-template-columns:1fr}}
/* staff */
.stafftable td,.stafftable th{white-space:nowrap}
.stafftable td.g{white-space:normal;min-width:180px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:10px 18px;border-radius:3px;font-weight:600;font-size:.9rem;z-index:10}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{transform:translate(-50%,8px);opacity:.4}}}

/* save status */
.save{display:inline-flex;align-items:flex-start;gap:7px;line-height:1.35}
.save::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;margin-top:.35em}
.save[data-s="ok"]::before{background:var(--ok)}
.save[data-s="busy"]::before{background:var(--warn)}
.save[data-s="bad"]{color:var(--bad);font-weight:600}
.save[data-s="bad"]::before{background:var(--bad)}
/* conference services */

    const conf=empty.map(dt=>`<label class="chk emptyok"><input type="checkbox" data-emptyok="${dt}" ${ok.includes(dt)?"checked":""}> Yes, we don't need any meals on ${fmtDate(dt,{weekday:"long",month:"short",day:"numeric"})}</label>`).join("");

    ${empty.length?`<div class="notice warn small"><b>${empty.length===1?"One day has":empty.length+" days have"} no meals or snacks.</b> If your group won't eat at Aspen Grove then, confirm below. Otherwise, go back and include them.<div class="checks" style="margin-top:8px">${conf}</div></div>`:""}

  return `<div class="notice ok">Everything required is filled in.</div><div class="row"><button class="btn gold" id="lock">Lock in reservation</button></div>`;

// Outline every missing field on screen. Turned on once someone reaches the review page or follows a missing-item link.

function goNeed(i){

// ---------- saving ----------
// Every save goes to the shared Aspen Grove record. Until it lands, a safety copy stays on this device,
// failed saves retry on their own, and the organizer is offered the copy back if they return before it lands.
let saveKind="", dirty=false, retryT=null, retryN=0, restoreOffer=null;
const clock=d=>(d?new Date(d):new Date()).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
function saveChip(){return `<span class="save" id="savestate" data-s="${saveKind}" role="status">${esc(saveState)}</span>`}
function setSaveState(t,kind){saveState=t;saveKind=kind||(/^Saving/.test(t)?"busy":/^Not saved|permission|can't/i.test(t)?"bad":"ok");const el=document.getElementById("savestate");if(el){el.textContent=t;el.dataset.s=saveKind}}
function scheduleSave(){if(!res||isLocked())return;dirty=true;setSaveState("Saving…");clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,700)}
function bakKey(c){return "agbak:"+c}
function bakPut(r){if(store.mode!=="db")return;try{localStorage.setItem(bakKey(r.code),JSON.stringify(r))}catch(e){}}
function bakGet(c){try{const x=localStorage.getItem(bakKey(c));return x?JSON.parse(x):null}catch(e){return null}}
function bakDel(c){try{localStorage.removeItem(bakKey(c))}catch(e){}}
const FATAL=["invalid_argument","quota_exceeded","revoked","not_granted","capability_disabled","capability_removed","transform_error","local"];
function saveNow(){
  if(!res)return saving;
  logEdits(res);
  const snap=JSON.parse(JSON.stringify({...res,updatedAt:new Date().toISOString()}));res.updatedAt=snap.updatedAt;
  dirty=true;bakPut(snap);clearTimeout(retryT);
  saving=saving.then(()=>store.put(snap)).then(()=>{
    if(res&&res.code===snap.code&&res.updatedAt===snap.updatedAt){dirty=false;bakDel(snap.code)}
    retryN=0;setSaveState(store.mode==="db"?"Saved to Aspen Grove · "+clock():"Saved on this device · "+clock(),"ok");
  }).catch(e=>{
    const code=e&&e.code;
    if(code==="invalid_argument"||code==="not_granted"||code==="revoked"){setSaveState("Not saved: this account can't save here. Your changes are kept on this device.","bad");return}
    if(code==="quota_exceeded"){setSaveState("Not saved: the reservation list is full. Contact Conference Services.","bad");return}
    retryN++;const wait=Math.min(30,2*2**(retryN-1));
    setSaveState(`Not saved yet. Kept on this device, retrying in ${wait}s.`,"bad");
    retryT=setTimeout(()=>{if(res&&res.code===snap.code&&dirty)saveNow()},wait*1000);
  });
  return saving;
}
window.addEventListener("online",()=>{if(res&&dirty)saveNow()});
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});

// ---------- change history ----------
const who={id:"",name:"",u:null};
const SECTION_FIELDS={"Group & contact":["group","contact","phone","email","headcount","startDate","endDate","onsite"],"Attendee notes":["attendeeNotes"],"Room & A/V":["setup","roomChanges","setupNotes","noAV","av","avOther"],"Breakout rooms":["breakoutNeed","breakouts"],"Walk-through":["walk"],"Allergies":["allergies","noAllergies","roster"],"Meals & snacks":["days","firstMeal","lastMeal"],"Comments":["comments"],"Checklist":["checklist"]};
function sectionSig(r){const o={};for(const[k,fs]of Object.entries(SECTION_FIELDS))o[k]=JSON.stringify(fs.map(f=>r[f]));return o}
let lastSig=null, actingAs="organizer";
function logEvent(r,what,extra){r.history=r.history||[];r.history.push({at:new Date().toISOString(),role:actingAs,by:who.id||"",what,...(extra||{})});if(r.history.length>80)r.history=r.history.slice(-80)}
function logEdits(r){
  const now=sectionSig(r);if(!lastSig){lastSig=now;return}
  const changed=Object.keys(now).filter(k=>now[k]!==lastSig[k]);lastSig=now;if(!changed.length)return;
  r.history=r.history||[];const h=r.history[r.history.length-1];
  if(h&&h.what==="Edited"&&h.role===actingAs&&h.by===(who.id||"")&&Date.now()-new Date(h.at)<30*60e3){h.at=new Date().toISOString();h.secs=[...new Set([...(h.secs||[]),...changed])]}
  else logEvent(r,"Edited",{secs:changed});
}
const ROLE={organizer:"Organizer",staff:"Conference Services"};
const nameCache={};
function historyList(r,limit){const h=[...(r.history||[])].reverse().slice(0,limit||100);
  if(!h.length)return `<p class="small muted" style="margin:0">No changes recorded yet. Changes made from now on are listed here with who made them and when.</p>`;
  return `<ul class="history">${h.map(x=>`<li><time datetime="${esc(x.at)}">${fmtDate(new Date(x.at),{month:"short",day:"numeric"})} · ${clock(x.at)}</time><span><b>${esc(x.what)}</b>${x.secs&&x.secs.length?`: ${esc(x.secs.join(", "))}`:""} <span class="who">· ${ROLE[x.role]||"Someone"}${x.by?` <span data-uid="${esc(x.by)}">${esc(nameCache[x.by]?"("+nameCache[x.by]+")":"")}</span>`:""}</span></span></li>`).join("")}</ul>`}
async function fillNames(){if(!who.u||!who.u.profiles)return;const els=[...document.querySelectorAll("[data-uid]")];const ids=[...new Set(els.map(e=>e.dataset.uid))].filter(i=>!(i in nameCache));
  if(ids.length){try{const ps=await who.u.profiles(ids);ids.forEach(i=>nameCache[i]=(ps[i]&&ps[i].name)||"")}catch(e){ids.forEach(i=>nameCache[i]="")}}
  document.querySelectorAll("[data-uid]").forEach(e=>{const n=nameCache[e.dataset.uid];e.textContent=n?"("+n+")":""})}

async function loadKitchen(){kitchenInfo=null;try{kitchenInfo=await store.allStaff()}catch(e){kitchenInfo={}}if(view==="staff"&&(needsInfo()))renderStaff()}
function allDates(){const s=new Set();(staffRows||[]).forEach(r=>(r.days||[]).forEach(d=>s.add(d.date)));return [...s].sort()}

const STAFF_MEALS=15; // staff plates for the food order guide; the production list shows guest counts only
const PLATE_LABEL={Milk:"Dairy-free",Eggs:"Egg-free",Fish:"No fish","Crustacean shellfish":"No shellfish","Tree nuts":"Tree-nut-free",Peanuts:"Peanut-free","Wheat/Gluten":"Gluten-free",Soybeans:"Soy-free",Sesame:"Sesame-free","Celiac disease":"Gluten-free (celiac: no cross-contact)",Vegan:"Vegan"};
const capFirst=t=>t.charAt(0).toUpperCase()+t.slice(1);
function prodItems(m,es){
  const bag=new Map();
  const add=(label,g,kind,plates)=>{const k=label.toLowerCase();const it=bag.get(k)||{label,groups:new Set(),kind,plates:0};if(g)it.groups.add(g);it.plates+=plates||0;bag.set(k,it)};
  let entrees=[];
  if(m.snack)es.forEach(x=>x.st.items.forEach(it=>add(it,x.r.group,"snack")));
  else{
    const ent=new Map();
    es.forEach(x=>{const o=m.list.find(o=>o.id===x.st.choice);if(!o)return;const meat=o.meat?(x.st.meat||"Chicken"):"";
      const k=o.id+"|"+meat;const e=ent.get(k)||{o,label:o.name+(meat?` (${meat})`:""),groups:new Set()};e.groups.add(x.r.group);ent.set(k,e)});
    entrees=[...ent.values()];
    entrees.forEach(e=>e.groups.forEach(g=>add(e.label,g,"entree")));
    es.forEach(x=>{if(x.veg){const v=VEG.find(v=>v.id===x.st.vegChoice);add((v?v.name:"Vegetarian plate")+" (vegetarian)",x.r.group,"veg",x.veg)}});
    entrees.forEach(e=>e.o.sides.split(/,\s*/).forEach(sd=>e.groups.forEach(g=>add(capFirst(sd.trim()),g,"side"))));
    es.forEach(x=>{const o=m.list.find(o=>o.id===x.st.choice);if(!o)return;
      if(m.k==="breakfast"){bfExtras(x.st).forEach(v=>add("Extra: "+v.toLowerCase(),x.r.group,"side"));if(bfLegacy(x.st))add("Breakfast add-on (items not picked; ask the group)",x.r.group,"side")}
      if(x.st.second&&o.second){const meat=x.st.meat||"Chicken";add(capFirst(o.meat?`2nd protein (${meat==="Beef"?"chicken":"beef"}) for fajitas`:`2nd protein for ${o.name.toLowerCase()}`),x.r.group,"side")}});
    (m.incl||"").split(/,\s*/).filter(Boolean).forEach(sd=>es.forEach(x=>add(capFirst(sd),x.r.group,"incl")));
  }
  const special=new Map();
  es.forEach(x=>{const per=new Map();x.al.forEach(a=>{if(a.allergy==="Vegetarian")return;const who=x.r.code+"|"+a.name.trim().toLowerCase(),lab=PLATE_LABEL[a.allergy]||("no "+a.allergy.toLowerCase());
      const p=per.get(who)||new Set();p.add(lab);per.set(who,p)});
    per.forEach(labs=>{const lab=[...labs].sort().join(" + "),k=lab.toLowerCase();const sp=special.get(k)||{label:lab,n:0};sp.n++;special.set(k,sp)})});
  const rows=[];
  if(m.snack)rows.push(...bag.values());
  else{
    entrees.forEach(e=>{rows.push({kind:"entree",label:e.label,groups:e.groups});
      const subs=e.o.sides.split(/,\s*/).map(sd=>capFirst(sd.trim()));
      es.forEach(x=>{const o=m.list.find(o=>o.id===x.st.choice);if(o!==e.o||(o.meat&&(x.st.meat||"Chicken")!==e.label.match(/\((\w+)\)$/)?.[1]))return;
        if(m.k==="breakfast"){bfExtras(x.st).forEach(v=>{const l="Extra: "+v.toLowerCase();if(!subs.includes(l))subs.push(l)});if(bfLegacy(x.st)&&!subs.includes("Add-on: items not picked"))subs.push("Add-on: items not picked")}
        if(x.st.second&&o.second){const l=o.meat?`2nd protein: ${(x.st.meat||"Chicken")==="Beef"?"chicken":"beef"}`:"2nd protein";if(!subs.includes(l))subs.push(l)}});
      subs.forEach(l=>rows.push({kind:"side",label:l,groups:new Set()}))});
    const veg=[...bag.values()].filter(i=>i.kind==="veg");
    if(veg.length){rows.push({kind:"head",label:"Vegetarian"});veg.forEach(v=>rows.push({...v,kind:"vegsub"}))}
    const inc=(m.incl||"").split(/,\s*/).filter(Boolean);
    if(inc.length){rows.push({kind:"head",label:"Served with every "+m.label.toLowerCase()});inc.forEach(sd=>rows.push({kind:"side",label:capFirst(sd),groups:new Set()}))}
  }
  return {items:[...bag.values()],rows,special:[...special.values()].sort((a,b)=>b.n-a.n),entrees};
}
// Service heading time: the actual time when every group eats together, otherwise "several times".
function svcTime(m,times){const u=[...new Set(times)];return u.length===1?(u[0]===m.time?fmtTime(m.time):`<span class="miss">${fmtTime(u[0])}</span> <span class="small">(standard ${fmtTime(m.time)})</span>`):`several times`}
function prodService(date,m){
  const es=weekEntries(date,m);if(!es.length)return null;
  const by=new Map();
  es.forEach(x=>{const t=x.time||m.time,w=x.where||defLoc(m),k=t+"|"+w;const g=by.get(k)||{time:t,where:w,offTime:!!x.time,offPlace:!!x.where,es:[]};g.es.push(x);by.set(k,g)});
  const servings=[...by.values()].sort((a,b)=>a.time.localeCompare(b.time)||a.where.localeCompare(b.where)).map(g=>({...g,guests:g.es.reduce((a,x)=>a+x.n,0),...prodItems(m,g.es)}));
  return {m,es,guests:es.reduce((a,x)=>a+x.n,0),servings};
}

    const g=sp.get(k)||{r:x.r,name:a.name,reqs:[],svc:[]};if(!g.reqs.some(q=>q.allergy===a.allergy))g.reqs.push(a);if(!g.svc.includes(sv.m.label))g.svc.push(sv.m.label);sp.set(k,g)})));

  const dayspec=spl.length?`<h2>Special plates today · ${spl.length} guest${spl.length===1?"":"s"}</h2><table class="ptab"><tbody>${spl.map(g=>`<tr><td class="cb">${box}</td><td>${esc(g.name)}${multi?` <span class="muted small">${esc(g.r.group)}</span>`:""}</td><td>${g.reqs.map(a=>`<span class="${isSevere(a)?"sev":""}">${esc(PLATE_LABEL[a.allergy]||a.allergy)}${a.type==="Medical"?" (medical)":isSevere(a)?" (severe)":""}</span>`).join("; ")}</td><td class="${g.svc.length===gsv(g.r.code)?"muted":"miss"} small" style="width:120px">${g.svc.length===gsv(g.r.code)?"All services":esc(g.svc.join(", "))}</td></tr>`).join("")}</tbody></table>`:"";

// A newer set of samples replaces the old samples only; groups loaded from a file stay.
function clearSamples(){try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("agres:")){let r=null;try{r=JSON.parse(localStorage.getItem(k))}catch(e){}if(r&&r.demo)ks.push(k,"agstaff:"+k.slice(6),"agbak:"+k.slice(6))}}ks.forEach(k=>localStorage.removeItem(k))}catch(e){}}
function clearLocal(){try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^ag(res|staff|bak):/.test(k))ks.push(k)}ks.forEach(k=>localStorage.removeItem(k))}catch(e){}}
function putAll(data){let n=0;(data.reservations||[]).forEach(r=>{if(r&&r.code){localStorage.setItem("agres:"+r.code,JSON.stringify(r));n++}});
  Object.entries(data.staffNotes||{}).forEach(([c,x])=>{if(x)localStorage.setItem("agstaff:"+c,JSON.stringify(x))});return n}
function seedDemo(){try{putAll(demoSeeds());localStorage.setItem(DEMO_FLAG,new Date().toISOString())}catch(e){}}
document.getElementById("banner").addEventListener("click",e=>{
  if(e.target.id==="demo-reset"){if(!confirm("Put the demo back to its sample groups? Anything you added or changed here is removed."))return;
    clearLocal();seedDemo();staffRows=null;kitchenInfo=null;res=null;renderHome();toast("Demo reset");return}
  if(e.target.id==="demo-load")document.getElementById("demo-file").click()});
document.getElementById("banner").addEventListener("change",async e=>{
  if(e.target.id!=="demo-file")return;const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
  try{const data=JSON.parse(await f.text());const n=putAll(data);if(!n)throw 0;staffRows=null;kitchenInfo=null;toast(`Loaded ${n} group${n===1?"":"s"} from ${f.name}`);setTab("staff");loadStaff()}
  catch(err){toast("That file isn't a reservation file")}});

// ---------- boot ----------
document.getElementById("tab-org").onclick=async()=>{if(view==="edit"||view==="review"){clearTimeout(saveTimer);if(dirty)saveNow()}await saving;renderHome()};
// Conference Services works as a home button: it always opens Groups (Current & upcoming).
document.getElementById("tab-staff").onclick=async()=>{if(view==="edit"||view==="review"){clearTimeout(saveTimer);if(dirty)saveNow()}await saving;pickStaffTab("groups");pastView=false;pastQuery="";staffMsg=null;startOpen=false;setTab("staff");loadStaff()};
function setTab(t){document.getElementById("tab-org").setAttribute("aria-pressed",t==="org");document.getElementById("tab-staff").setAttribute("aria-pressed",t==="staff")}
const ready=store.init();
(async()=>{try{const u=window.claude&&claude.use?await claude.use("user"):null;if(!u)return;who.u=u;
  try{who.id=(u.id?await u.id():"")||""}catch(e){}
  if(!who.id){try{const me=await u.me();who.id=(me&&me.id)||""}catch(e){}}}catch(e){}})();
function openFromHash(){const h=decodeURIComponent(location.hash.slice(1)).trim().toUpperCase();if(/^AG-[A-Z0-9]{5}$/.test(h)){actingAs="organizer";openCode(h)}}
window.addEventListener("hashchange",openFromHash);
// ---------- browser Back / Forward ----------
// Each screen change is recorded in the browser's history (the address stays the same), so Back returns to the previous screen instead of leaving the page.
let restoring=false;
function navState(){const code=view==="sheet"?(sheetCtx&&sheetCtx.r.code)||"":(view==="home"||view==="staff")?"":(res&&res.code)||"";
  const past=view==="staff"&&staffTab==="groups"&&pastView;
  const st={v:view,tab:view==="staff"?staffTab:"",past,code,act:actingAs,from:view==="sheet"&&sheetCtx?sheetCtx.from:""};st.key=st.v+"|"+st.tab+(past?":past":"")+"|"+st.code;return st}
function remember(){try{const st=navState(),cur=history.state;if(cur&&cur.key===st.key)return;
  if(restoring||!cur||!cur.key)history.replaceState(st,"");else history.pushState(st,"")}catch(e){}}
["renderHome","renderEditor","renderReview","renderSheet","renderStaff","renderPlan"].forEach(n=>{const f=window[n];window[n]=function(...a){const out=f.apply(this,a);remember();return out}});
async function restoreNav(st){
  restoring=true;
  try{
    if(view==="edit"||view==="review"){clearTimeout(saveTimer);if(dirty)saveNow();await saving}
    actingAs=st.act||"organizer";
    if(st.v==="home")renderHome();
    else if(st.v==="staff"){staffTab=st.tab||"groups";pastView=!!st.past;pastQuery="";staffMsg=null;startOpen=false;pendingDelete=null;await loadStaff()}
    else if(st.v==="edit"||st.v==="review"){
      if(!res||res.code!==st.code){const r=await store.get(st.code).catch(()=>null);if(!r){renderHome();return}openEditor(r)}
      if(st.v==="review")renderReview();else{view="edit";renderEditor()}window.scrollTo(0,0)}
    else if(st.v==="sheet"){await openSheet(st.code);if(sheetCtx)sheetCtx.from=st.from||"staff"}
    else if(st.v==="staffplan"){await openPlan(st.code)}
  }finally{restoring=false}
}
window.addEventListener("popstate",e=>{if(e.state&&e.state.key)restoreNav(e.state)});
renderHome();openFromHash();
